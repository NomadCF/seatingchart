name: Fix V6.9 menu wiring
on:
  push:
    branches: [feat/v6.9-interoperability]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v6.9-interoperability
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/fix-v69-entry.mjs
      - run: npm install --no-package-lock
      - run: npm run build
      - run: cp dist/Classroom-Seating-Planner.html index.html
      - run: npm test
      - name: Commit V6.9 menu fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scripts/030-interoperability-v69.js .github/workflows/ci.yml index.html
          git commit -m "Fix V6.9 roster interoperability menu access" || exit 0
          git push origin HEAD:feat/v6.9-interoperability
