name: V7.0.3 Testing Mode integration

on:
  push:
    branches: [feat/v7.0.3-testing-mode]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize V7.0.3 source and regression test
        shell: bash
        run: |
          base64 -d .integration/v703-module.b64 | gunzip > src/scripts/035-testing-mode-v703.js
          base64 -d .integration/v703-test.b64 | gunzip > tests/browser/testing-mode-v703.spec.mjs
          node --check src/scripts/035-testing-mode-v703.js
          node --check tests/browser/testing-mode-v703.spec.mjs
      - name: Integrate V7.0.3 release metadata and persistence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'{path}: expected fragment not found: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once('src/scripts/000-core.js', "version: '7.0.2',", "version: '7.0.3',")
          replace_once('src/scripts/000-core.js', "buildDate: '2026-09-05T02:35:00Z',", "buildDate: '2026-09-05T03:20:00Z',")
          replace_once('src/scripts/000-core.js', "    stationRotations: source.stationRotations && typeof source.stationRotations === 'object' ? deepClone(source.stationRotations) : null,\n    canvas: {", "    stationRotations: source.stationRotations && typeof source.stationRotations === 'object' ? deepClone(source.stationRotations) : null,\n    testingMode: source.testingMode && typeof source.testingMode === 'object' ? deepClone(source.testingMode) : null,\n    canvas: {")
          replace_once('src/scripts/000-core.js', "const PROJECT_FEATURES = [\n  { title: 'Station Rotations',", "const PROJECT_FEATURES = [\n  { title: 'Testing Mode', text: 'Generate a separate testing Activity Layout that maximizes practical student separation, preserves locked seat positions and assignments, checks accessibility/front/aisle needs, explains physical spacing limits, and produces a normal-room-to-testing transition plan before anything is applied.' },\n  { title: 'Station Rotations',")
          replace_once('src/manifest.json', '    "034-station-rotations-v702.js",\n    "025-classroom-feature-pack-v66.js",', '    "034-station-rotations-v702.js",\n    "035-testing-mode-v703.js",\n    "025-classroom-feature-pack-v66.js",')
          replace_once('src/index.template.html', '<meta name="app-version" content="7.0.2" />', '<meta name="app-version" content="7.0.3" />')
          replace_once('src/index.template.html', '<meta name="build-date" content="2026-09-05T02:35:00Z" />', '<meta name="build-date" content="2026-09-05T03:20:00Z" />')
          replace_once('package.json', '"version": "7.0.2"', '"version": "7.0.3"')
          replace_once('service-worker.js', "const CACHE_VERSION = 'classroom-seating-planner-v7.0.2-pwa1';", "const CACHE_VERSION = 'classroom-seating-planner-v7.0.3-pwa1';")
          replace_once('src/scripts/025-classroom-feature-pack-v66.js', '    window.ActivityLayoutsV701,\n    window.StationRotationsV702\n  ].filter(Boolean);', '    window.ActivityLayoutsV701,\n    window.StationRotationsV702,\n    window.TestingModeV703\n  ].filter(Boolean);')
          replace_once('src/scripts/025-classroom-feature-pack-v66.js', "document.body.dataset.featurePack = '7.0.2';", "document.body.dataset.featurePack = '7.0.3';")
          replace_once('README.md', '![Version](https://img.shields.io/badge/version-7.0.2-2563eb?style=flat-square)', '![Version](https://img.shields.io/badge/version-7.0.3-2563eb?style=flat-square)')
          readme = Path('README.md')
          s = readme.read_text()
          if '### V7.0.3 Testing Mode' not in s:
              anchor = '### V7.0.2 Station Rotations\n\n'
              block = "### V7.0.3 Testing Mode\n\nGenerate a non-destructive testing-room preview from the current Freeform classroom, maximize practical center-to-center student spacing, preserve locked seat positions and existing student assignments, respect configured accessibility/front/aisle needs, and explain when the requested separation cannot physically fit around the current roster and fixed room objects. Applying the preview creates a separate Activity Layout and keeps the original arrangement available for the return transition. Testing Mode also provides an ordered physical move list and uses feet/meters when the Classroom Digital Twin is scaled.\n\n"
              if anchor not in s: raise SystemExit('README V7.0.2 anchor missing')
              readme.write_text(s.replace(anchor, block + anchor, 1))
          changelog = Path('CHANGELOG.md')
          s = changelog.read_text()
          if not s.startswith('## 7.0.3 - 2026-09-04'):
              block = """## 7.0.3 - 2026-09-04\n\n### Testing Mode\n- Added a dedicated non-destructive Testing Mode preview for Freeform classrooms.\n- Generates practical maximum-separation seat geometry without changing student assignments.\n- Preserves locked seat positions by default and keeps fixed Digital Twin room objects as physical constraints.\n- Uses Today Mode's active roster for spacing calculations while keeping absent/unused seat furniture in the room.\n- Checks required accessibility/front/aisle needs during placement and calls out remaining teacher-review issues.\n- Explains when requested center-to-center spacing cannot fit because of room size, fixed furniture, locked seats, or active roster count.\n- Added ordered normal-room-to-testing transition instructions with feet/meters when physical room scale is enabled.\n- Applying a preview creates a separate Testing Activity Layout and records the source layout for an explicit return path.\n- Preview overlays are non-interactive, hidden from print, and responsive on desktop/mobile.\n- Testing metadata is additive inside Freeform layout data; planner data schema remains 13 and encryption envelope remains 3.\n\n"""
              changelog.write_text(block + s)
          vr = Path('tools/validate-release.mjs')
          s = vr.read_text()
          s = s.replace("['V7.0.2 app version metadata', /name=[\"']app-version[\"']\\s+content=[\"']7\\.0\\.2[\"']/i.test(built)],", "['V7.0.3 app version metadata', /name=[\"']app-version[\"']\\s+content=[\"']7\\.0\\.3[\"']/i.test(built)],")
          marker = "  ['V7.0.2 Today Mode roster integration present', /typeof seatingStudents === 'function'/.test(built)]\n];"
          replacement = "  ['V7.0.2 Today Mode roster integration present', /typeof seatingStudents === 'function'/.test(built)],\n  ['V7.0.3 Testing Mode engine present', /TestingModeV703/.test(built)],\n  ['V7.0.3 Testing Mode persistence present', /testingMode: source\\.testingMode/.test(built)],\n  ['V7.0.3 spacing feasibility engine present', /minimumSpacing/.test(built) && /spacingConflicts/.test(built)],\n  ['V7.0.3 transition-plan engine present', /transitionSteps/.test(built) && /Return to source layout/.test(built)],\n  ['V7.0.3 non-interactive preview overlay present', /v703-testing-preview/.test(built)]\n];"
          if marker not in s: raise SystemExit('validate-release V7.0.2 marker missing')
          vr.write_text(s.replace(marker, replacement, 1))
          for spec in Path('tests/browser').glob('*.spec.mjs'):
              lines = spec.read_text().splitlines(True)
              out = []
              for line in lines:
                  if 'app-version' in line and '7.0.2' in line: line = line.replace('7.0.2', '7.0.3')
                  out.append(line)
              spec.write_text(''.join(out))
          PY
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build portable single-file product
        run: |
          npm run build
          cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate release and service worker
        run: |
          npm test
          node --check service-worker.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npm run test:browser
      - name: Commit integrated V7.0.3 product
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/scripts/000-core.js src/scripts/025-classroom-feature-pack-v66.js src/scripts/035-testing-mode-v703.js src/manifest.json src/index.template.html package.json service-worker.js README.md CHANGELOG.md tools/validate-release.mjs tests/browser index.html
          git rm -r .integration .github/workflows/v703-integration.yml
          git commit -m 'V7.0.3 Testing Mode'
          git push origin HEAD:feat/v7.0.3-testing-mode
