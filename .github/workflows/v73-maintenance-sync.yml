name: One-time V7.3 repository sync

# Final branch-only synchronization using the UI-readiness critical smoke gate.
on:
  push:
    branches:
      - maintenance/v7.3-repo-sync
    paths:
      - '.github/workflows/v73-maintenance-sync.yml'
      - 'tools/v73-maintenance-sync.py'
      - 'tests/browser/critical-smoke.spec.mjs'
      - 'tools/build-browser-harness.mjs'

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Synchronize V7.3 release surfaces
        run: |
          python3 tools/v73-maintenance-sync.py
          find src -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.json' \) -print0 | xargs -0 sed -i 's/[[:space:]]\+$//'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build and synchronize generated HTML
        run: |
          npm run build
          cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate synchronized V7.3 release
        run: |
          npm test
          node --check service-worker.js
          git diff --check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run new desktop/mobile critical smoke gate
        run: npm run test:smoke
      - name: Commit synchronized release files
        run: |
          if git diff --quiet; then
            echo 'V7.3 repository is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md docs/WCAG-2.2-AA-AUDIT.md src/ index.html dist/Classroom-Seating-Planner.html
          git commit -m 'Synchronize active V7.3 release files'
          git push
