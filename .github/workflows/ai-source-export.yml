name: AI source export

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: seatingchart-source
          path: |
            index.html
            README.md
            CHANGELOG.md
            LICENSE
            SECURITY.md
            PRIVACY.md
            DATA-HANDLING.md
            manifest.webmanifest
            service-worker.js
            package.json
            playwright.config.mjs
            src/
            tools/
            schemas/
            docs/
            tests/
          if-no-files-found: error
          retention-days: 1
