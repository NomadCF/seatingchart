name: Rebuild V6.9 index
on:
  push:
    branches: [feat/v6.9-interoperability]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v6.9-interoperability
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-package-lock
      - run: npm run build
      - run: cp dist/Classroom-Seating-Planner.html index.html
      - run: npm test
      - name: Commit generated single-file output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild V6.9 single-file output" || exit 0
          git push origin HEAD:feat/v6.9-interoperability
