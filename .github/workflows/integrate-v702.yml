name: Integrate V7.0.2 Station Rotations
on:
  push:
    branches: [feat/v7.0.2-station-rotations]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7.0.2-station-rotations
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Integrate V7.0.2 source changes
        run: node tools/integrate-v702.mjs
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build single-file application
        run: npm run build
      - name: Refresh deployed single-file application
        run: cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate deterministic release
        run: npm test
      - name: Validate JSON schemas
        run: node -e "for (const f of ['schemas/planner-v13.schema.json','schemas/envelope-v3.schema.json','schemas/roster-import-v1.schema.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('Schemas parse cleanly.')"
      - name: Check service worker syntax
        run: node --check service-worker.js
      - name: Commit integrated V7.0.2 source and build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scripts/000-core.js src/scripts/025-classroom-feature-pack-v66.js src/scripts/034-station-rotations-v702.js src/manifest.json src/index.template.html package.json service-worker.js README.md CHANGELOG.md tools/validate-release.mjs tests/browser/digital-twin-v700.spec.mjs tests/browser/activity-layouts-v701.spec.mjs tests/browser/station-rotations-v702.spec.mjs index.html
          git commit -m "Integrate V7.0.2 Station Rotations" || exit 0
          git push origin HEAD:feat/v7.0.2-station-rotations
