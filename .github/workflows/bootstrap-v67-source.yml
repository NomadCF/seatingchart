name: Bootstrap V6.7 modular source

on:
  pull_request:
    branches: [main]
    paths:
      - tools/split-monolith.mjs
      - tools/build-single-file.mjs

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/v6.7-production-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate modular source from the verified monolith
        run: node tools/split-monolith.mjs
      - name: Commit modular source tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bootstrap V6.7 modular source tree"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
