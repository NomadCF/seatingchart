name: Integrate V6.8.2
on:
  push:
    branches: [feat/v6.8.2-physical-table-pods]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v6.8.2-physical-table-pods
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/integrate-v682.mjs
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build
      - run: cp dist/Classroom-Seating-Planner.html index.html
      - run: npm test
      - name: Commit deterministic release output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/index.template.html src/scripts/000-core.js service-worker.js tools/validate-release.mjs CHANGELOG.md tests/browser/smoke.spec.mjs index.html
          git commit -m "Integrate V6.8.2 release metadata and deterministic build" || exit 0
          git push origin HEAD:feat/v6.8.2-physical-table-pods
