name: One-time V8 release synchronization

on:
  push:
    branches: [feat/v8-ui-overhaul]
    paths:
      - '.github/workflows/v8-release-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Synchronize V8.0.0 metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          version = '8.0.0'
          date = '2026-09-05'
          display = 'September 5, 2026'

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          pkg['version'] = version
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          template_path = Path('src/index.template.html')
          template = template_path.read_text()
          template = re.sub(r'<meta name="app-version" content="[^"]+" />', f'<meta name="app-version" content="{version}" />', template, count=1)
          template_path.write_text(template)

          core_path = Path('src/scripts/000-core.js')
          core = core_path.read_text()
          core, n = re.subn(r"version: '[^']+'", f"version: '{version}'", core, count=1)
          if n != 1:
              raise SystemExit('Could not update APP_CONFIG version')
          core = re.sub(r"releaseDate: '[^']+'", f"releaseDate: '{date}'", core, count=1)
          core = re.sub(r"releaseDateDisplay: '[^']+'", f"releaseDateDisplay: '{display}'", core, count=1)
          if "version: '8.0.0'" not in core.split('const RELEASE_HISTORY = [', 1)[1][:1600]:
              marker = 'const RELEASE_HISTORY = [\n'
              entry = """  {\n    version: '8.0.0',\n    date: 'September 5, 2026',\n    title: 'Focused five-workspace interface overhaul',\n    current: true,\n    changes: [\n      'Reorganized the application around five canonical workspaces: Class, Room, Seat, Plans, and Review.',\n      'Replaced the old workflow strip with a focused desktop navigation rail and mobile bottom navigation.',\n      'Added a contextual action bar so each workspace shows only the actions relevant to the current task.',\n      'Reduced interface clutter by isolating roster/rule tools, room-design tools, seating actions, planning tools, and final review/share controls into their canonical workspaces.',\n      'Moved mobile roster and review details into secondary sheet-style surfaces instead of squeezing desktop side panels into the phone layout.',\n      'Kept seat zoom and seat text-size controls available anywhere the chart is visible and preserved mobile room panning.',\n      'Kept Planner Assistant and Settings globally recoverable while suppressing repeated contextual Guide me controls.',\n      'Preserved Presentation Mode as a locked Review experience and preserved automatic Design Mode shutdown when leaving Room.',\n      'Promoted the rounded table/pod and student-tile visual language across planning and review surfaces without changing saved seating data.',\n      'Added dedicated desktop and mobile V8 regression coverage for navigation, workspace isolation, Design Mode lifecycle, zoom/text controls, Assistant/Settings access, overflow, and mobile secondary panels.'\n    ]\n  },\n"""
              if marker not in core:
                  raise SystemExit('Could not find release history marker')
              core = core.replace(marker, marker + entry, 1)
          core_path.write_text(core)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          if not changelog.lstrip().startswith('## 8.0.0'):
              section = """## 8.0.0 - 2026-09-05\n\n### Complete interface overhaul\n- Reorganized Classroom Seating Planner around five focused workspaces: **Class**, **Room**, **Seat**, **Plans**, and **Review**.\n- Replaced the old five-stage workflow strip with a compact desktop navigation rail and mobile bottom navigation.\n- Added a contextual workspace bar that exposes only the primary actions relevant to the current task instead of showing every tool at once.\n- Consolidated roster, notes, groups/rules, zones, and imports into Class; room geometry and Freeform/Grid tools into Room; student placement and conflict work into Seat; saved/alternate plans and activity tools into Plans; and final analysis, Presentation Mode, print/export, save/share into Review.\n- Reduced desktop clutter by hiding unrelated side panels, toolbars, and secondary controls outside their canonical workspace.\n- Reworked mobile navigation so roster and review detail panels appear as secondary sheet-style surfaces while the classroom canvas remains usable and pannable.\n- Preserved seat zoom and seat text-size controls anywhere seating is visible.\n- Preserved automatic Design Mode shutdown when leaving Room and kept Presentation Mode locked to Review.\n- Kept Planner Assistant and Settings globally recoverable while removing repeated contextual Guide me controls.\n- Continued the rounded table/pod, student-tile, clear-empty-seat, compact-status visual language without changing planner save data.\n- Added dedicated V8 desktop/mobile regression coverage for workspace navigation, isolation, mobile sheets, Design Mode lifecycle, global Assistant/Settings access, viewport overflow, and chart display controls.\n- Existing classroom, encryption, Google Drive/Classroom, Planner Assistant, planning, sharing, save, export, and data-schema engines remain intact.\n- Planner data schema remains 13 and encryption envelope remains 3.\n\n"""
              changelog_path.write_text(section + changelog)

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text()
          sw = re.sub(r"const CACHE_VERSION = 'classroom-seating-planner-v[^']+';", "const CACHE_VERSION = 'classroom-seating-planner-v8.0.0-pwa1';", sw, count=1)
          sw_path.write_text(sw)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = re.sub(r'version-[0-9.]+-2563eb', 'version-8.0.0-2563eb', readme, count=1)
          readme = readme.replace('## A five-stage classroom workflow', '## Five focused workspaces')
          readme = readme.replace('The workflow is intentionally guided, but teachers can still move between stages as the classroom changes.', 'The V8 interface keeps these areas focused while teachers can move between workspaces whenever the classroom changes.')
          readme_path.write_text(readme)
          PY

      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build synchronized portable app
        run: |
          npm run build
          cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate synchronized V8 release
        run: |
          npm test
          node --check service-worker.js
          cmp --silent dist/Classroom-Seating-Planner.html index.html
      - name: Commit synchronized V8 release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/index.template.html src/scripts/000-core.js CHANGELOG.md README.md service-worker.js index.html
          if git diff --cached --quiet; then
            echo 'V8 release already synchronized.'
            exit 0
          fi
          git commit -m 'release: synchronize V8.0.0 metadata and single-file build'
          git push origin HEAD:feat/v8-ui-overhaul
