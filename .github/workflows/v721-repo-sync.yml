name: V7.2.1 repository sync

on:
  push:
    branches: [maintenance/v7.2.1-repo-cleanup]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/v7.2.1-repo-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply repository synchronization
        run: node tools/v721-repo-sync.mjs
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Rebuild portable application
        run: npm run build
      - name: Synchronize hosted entry point
        run: cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate release
        run: npm test
      - name: Validate service worker
        run: node --check service-worker.js
      - name: Validate repository whitespace
        run: git diff --check
      - name: Commit synchronized repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No synchronization changes to commit."
          else
            git commit -m "Synchronize repository with V7.2.1 production"
            git push origin HEAD:maintenance/v7.2.1-repo-cleanup
          fi
