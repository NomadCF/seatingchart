name: Restore hosted index CRLF

on:
  push:
    branches:
      - fix/hosted-pwa-drive-picker

permissions:
  contents: write

jobs:
  restore-crlf:
    if: ${{ !contains(github.event.head_commit.message, '[crlf-restored]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hosted-pwa-drive-picker
          fetch-depth: 0
      - name: Restore CRLF line endings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          data = path.read_bytes().replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
          path.write_bytes(data)
          PY
      - name: Commit line-ending normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore index CRLF line endings [crlf-restored]"
          git push origin HEAD:fix/hosted-pwa-drive-picker
