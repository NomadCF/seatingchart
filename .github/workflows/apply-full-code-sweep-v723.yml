name: Apply V7.2.3 maintenance cleanup

on:
  push:
    branches: [maintenance/full-code-sweep-v723]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/full-code-sweep-v723
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply maintenance cleanup
        run: node tools/full-code-sweep-v723.mjs
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Rebuild portable application
        run: npm run build
      - name: Synchronize hosted entry point
        run: cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate release
        run: npm test
      - name: Check service worker syntax
        run: node --check service-worker.js
      - name: Check whitespace
        run: git diff --check
      - name: Confirm stale removed-feature references are gone
        run: |
          if grep -RInE 'Planner Assistant|PlannerAssistantV710|plannerAssistantV710|planner-command-v1|PLANNER-ASSISTANT' README.md DATA-HANDLING.md SECURITY.md docs src tests tools/validate-release.mjs CHANGELOG.md; then
            echo 'Stale removed-feature references remain.'
            exit 1
          fi
      - name: Confirm stale V7.2.1 assertions are gone
        run: |
          if grep -RInE "toHaveAttribute\('content', '7\.2\.1'\)|V7\.2\.1 retains the V7\.2 Planner Packs model" tests DATA-HANDLING.md; then
            echo 'Stale V7.2.1 release assertions remain.'
            exit 1
          fi
      - name: Commit synchronized V7.2.3 cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Complete V7.2.3 full code and documentation sweep'
          git push origin HEAD:maintenance/full-code-sweep-v723
