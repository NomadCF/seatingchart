name: Bootstrap committed modular source

on:
  push:
    branches: [feat/v6.7-production-hardening]
    paths:
      - .github/workflows/bootstrap-source-branch.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v6.7-production-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/split-monolith.mjs
      - name: Commit source tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/
          git commit -m "Bootstrap V6.7 modular source tree"
          git push origin HEAD:feat/v6.7-production-hardening
