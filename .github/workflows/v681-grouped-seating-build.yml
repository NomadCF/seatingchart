name: V681 Grouped Seating Build

on:
  push:
    branches:
      - feat/v6.8.1-grouped-seating-visuals
    paths:
      - .github/workflows/v681-grouped-seating-build.yml
      - tools/integrate-v681.mjs

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v6.8.1-grouped-seating-visuals
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare V6.8.1 release sources
        run: node tools/integrate-v681.mjs
      - name: Install dependencies
        run: npm install
      - name: Rebuild portable application
        run: node tools/build-single-file.mjs && cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate deterministic release
        run: npm test
      - name: Validate grouped seating module syntax
        run: node --check src/scripts/028-grouped-seating-visuals-v681.js
      - name: Commit integrated release
        run: |
          rm .github/workflows/v681-grouped-seating-build.yml
          rm tools/integrate-v681.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate V6.8.1 grouped seating visuals [generated v681]"
          git push origin HEAD:feat/v6.8.1-grouped-seating-visuals
