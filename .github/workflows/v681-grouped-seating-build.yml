name: Build V6.8.1 grouped seating release

on:
  push:
    branches:
      - feat/v6.8.1-grouped-seating-visuals
    paths:
      - .github/workflows/v681-grouped-seating-build.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v6.8.1-grouped-seating-visuals
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Integrate V6.8.1 source and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:80]}')
              p.write_text(text.replace(old, new, count))

          # Runtime/release version metadata.
          replace('src/scripts/000-core.js', "version: '6.8.0',", "version: '6.8.1',", 1)
          replace('src/index.template.html', 'name="app-version" content="6.8.0"', 'name="app-version" content="6.8.1"', 1)
          replace('package.json', '"version": "6.8.0"', '"version": "6.8.1"', 1)
          replace('service-worker.js', "classroom-seating-planner-v6.8.0-pwa1", "classroom-seating-planner-v6.8.1-pwa1", 1)
          replace('tools/validate-release.mjs', "['V6.8 app version metadata', /name=[\"']app-version[\"']\\s+content=[\"']6\\.8\\.0[\"']/i.test(built)],", "['V6.8.1 app version metadata', /name=[\"']app-version[\"']\\s+content=[\"']6\\.8\\.1[\"']/i.test(built)],", 1)
          replace('tools/validate-release.mjs', "['V6.8 smallest-change repair UI present', /previewIntelligenceRepairBtn/.test(built)]", "['V6.8 smallest-change repair UI present', /previewIntelligenceRepairBtn/.test(built)],\n  ['V6.8.1 grouped seating visual system present', /GroupedSeatingVisualsV681/.test(built)],\n  ['V6.8.1 grouped pod renderer present', /v681-pod-halo/.test(built)],\n  ['V6.8.1 print-safe grouped seating styles present', /@media print[\\s\\S]*v681-pod-halo/.test(built)]", 1)

          # Ordered module build and feature-pack lifecycle.
          manifest = Path('src/manifest.json')
          text = manifest.read_text()
          needle = '    "027-classroom-intelligence-v68.js",\n    "025-classroom-feature-pack-v66.js"'
          if needle not in text:
              raise SystemExit('Could not locate V6.8 module ordering in src/manifest.json')
          manifest.write_text(text.replace(needle, '    "027-classroom-intelligence-v68.js",\n    "028-grouped-seating-visuals-v681.js",\n    "025-classroom-feature-pack-v66.js"', 1))

          replace('src/scripts/025-classroom-feature-pack-v66.js', '    window.ClassroomIntelligenceV68\n', '    window.ClassroomIntelligenceV68,\n    window.GroupedSeatingVisualsV681\n', 1)
          replace('src/scripts/025-classroom-feature-pack-v66.js', "document.body.dataset.featurePack = '6.8';", "document.body.dataset.featurePack = '6.8.1';", 1)

          # Public feature/release copy, without changing the underlying data schema.
          replace('src/scripts/000-core.js', "const PROJECT_FEATURES = [\n", "const PROJECT_FEATURES = [\n  { title: 'Grouped seating visual language', text: 'Freeform tables, pods, seats, presentation views, printed charts, copied chart images, and plan comparisons now share a clearer grouped-seating treatment with subtle pod boundaries, deliberate open-seat states, compact status cues, and zoom-aware readability.' },\n", 1)

          # Changelog and README.
          changelog = Path('CHANGELOG.md')
          c = changelog.read_text()
          entry = '''## 6.8.1 — 2026-09-04\n\n### Grouped seating visual refinement\n\n- Refined Freeform tables and pods so grouped seating reads as a coherent classroom unit rather than unrelated rectangles.\n- Added subtle pod boundaries and labels using existing Freeform group geometry and group colors, with nearby ungrouped seats visually associated to tables without modifying saved seating data.\n- Refined occupied, open, locked, selected, valid, caution, conflict, and temporary-absence seat states while keeping the student name visually dominant.\n- Added cleaner Presentation/Eye-mode treatment that removes secondary seat detail while retaining table and pod context.\n- Preserved grouped seating in print with grayscale-safe boundaries and deliberate open-seat styling.\n- Updated Copy chart as image to render tables, pod boundaries, seats, labels, rotations, open seats, locks, and rule-state cues from the same Freeform geometry.\n- Updated Freeform plan-comparison previews to preserve table/pod relationships and changed-seat highlighting.\n- Added zoom-aware detail reduction and seat-text-scale compatibility without altering drag/drop, swapping, movement, rotation, locking, rule evaluation, undo/redo, or the saved data schema.\n\n'''
          if '## 6.8.1 — 2026-09-04' not in c:
              c = c.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(c)

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace('version-6.8.0-', 'version-6.8.1-', 1)
          marker = '### What makes it different\n'
          note = '''### V6.8.1 grouped seating refinement\n\nFreeform tables and pods now read as intentional groups across Room Design, Seat Students, Presentation mode, print, copied chart images, and Freeform plan comparisons. The refinement uses subtle pod boundaries, clearer table surfaces, deliberate open-seat styling, compact state cues, and the existing group colors without changing the saved seating model.\n\n'''
          if note not in r and marker in r:
              r = r.replace(marker, note + marker, 1)
          readme.write_text(r)

          # Browser regression coverage. It runs in both configured desktop and mobile projects.
          tests = Path('tests/browser/smoke.spec.mjs')
          t = tests.read_text()
          test_block = r'''

test('V6.8.1 grouped Freeform seating remains coherent across states and zoom', async ({ page }) => {
  await page.goto('/index.html', { waitUntil: 'domcontentloaded' });
  await completeFreshSecuritySetupIfNeeded(page);
  await closeAutomaticGettingStartedIfNeeded(page);
  await page.evaluate(() => {
    state.layoutMode = 'freeform';
    state.students = [
      { id: 'v681-a', firstName: 'Avery', lastName: 'Stone', archived: false },
      { id: 'v681-b', firstName: 'Morgan', lastName: 'Reed', archived: false }
    ];
    state.groups = [];
    state.zones = [];
    state.todaySession = { ...(state.todaySession || {}), active: true, absentStudentIds: ['v681-b'] };
    state.freeformLayout = {
      canvas: { width: 1000, height: 700, zoom: 1, frontSide: 'top', snap: true },
      nextZ: 10,
      groups: [{ id: 'pod-a', name: 'Blue Pod', color: '#6f8f82', locked: false }],
      roomHistory: [],
      objects: [
        { id: 'table-a', type: 'table', label: 'Table A', x: 320, y: 260, width: 250, height: 145, rotation: 0, zIndex: 1, groupId: 'pod-a', locked: false },
        { id: 'seat-a', type: 'seat', label: 'A1', x: 330, y: 135, width: 176, height: 112, rotation: 0, zIndex: 2, groupId: 'pod-a', assignedStudentId: 'v681-a', locked: true, manual: false, anchorGroupIds: [], zoneIds: [] },
        { id: 'seat-b', type: 'seat', label: 'A2', x: 540, y: 275, width: 176, height: 112, rotation: 90, zIndex: 3, groupId: 'pod-a', assignedStudentId: 'v681-b', locked: false, manual: false, anchorGroupIds: [], zoneIds: [] },
        { id: 'seat-c', type: 'seat', label: 'A3', x: 330, y: 430, width: 176, height: 112, rotation: 0, zIndex: 4, groupId: 'pod-a', assignedStudentId: null, locked: false, manual: false, anchorGroupIds: [], zoneIds: [] }
      ]
    };
    renderFreeformLayout();
  });
  await expect(page.locator('#seatGrid')).toHaveAttribute('data-v681-grouped-visuals', '6.8.1');
  await expect(page.locator('.v681-pod-halo')).toHaveCount(1);
  await expect(page.locator('.v681-pod-label')).toHaveText('Blue Pod');
  await expect(page.locator('.freeform-object.table.v681-table-surface')).toHaveCount(1);
  await expect(page.locator('.freeform-object.seat.v681-seat-tile')).toHaveCount(3);
  await expect(page.locator('.freeform-object[data-object-id="seat-a"]')).toHaveAttribute('data-v681-status-kind', 'locked');
  await expect(page.locator('.freeform-object[data-object-id="seat-b"]')).toHaveAttribute('data-v681-status-kind', 'absent');
  await expect(page.locator('.freeform-object[data-object-id="seat-c"]')).toHaveAttribute('data-v681-status-kind', 'open');

  const baseFont = await page.locator('.freeform-object[data-object-id="seat-a"] .freeform-object-title').evaluate(node => parseFloat(getComputedStyle(node).fontSize));
  await page.evaluate(() => document.body.style.setProperty('--seat-text-scale', '1.45'));
  const largerFont = await page.locator('.freeform-object[data-object-id="seat-a"] .freeform-object-title').evaluate(node => parseFloat(getComputedStyle(node).fontSize));
  expect(largerFont).toBeGreaterThan(baseFont);

  await page.evaluate(() => { state.freeformLayout.canvas.zoom = 0.55; renderFreeformLayout(); });
  await expect(page.locator('#seatGrid')).toHaveAttribute('data-v681-zoom-band', 'low');
  await expect(page.locator('.freeform-object[data-object-id="seat-a"] .freeform-object-meta')).toHaveCSS('display', 'none');

  await page.evaluate(() => document.body.classList.add('visibility-mode'));
  await expect(page.locator('.freeform-object[data-object-id="seat-a"] .freeform-object-meta')).toHaveCSS('display', 'none');
  await expect(page.locator('.v681-pod-halo')).toBeVisible();

  const exportResult = await page.evaluate(() => {
    const canvas = window.GroupedSeatingVisualsV681.chartCanvas();
    const preview = window.GroupedSeatingVisualsV681.planPreviewMarkup({ name: 'Preview', layoutMode: 'freeform', freeformLayout: state.freeformLayout }, [], 'Plan A');
    return { width: canvas.width, height: canvas.height, hasPod: preview.includes('v681-mini-pod'), hasTable: preview.includes('v681-mini-object table') };
  });
  expect(exportResult.width).toBeGreaterThan(0);
  expect(exportResult.height).toBeGreaterThan(0);
  expect(exportResult.hasPod).toBeTruthy();
  expect(exportResult.hasTable).toBeTruthy();
});
'''
          if "V6.8.1 grouped Freeform seating remains coherent" not in t:
              t += test_block
          tests.write_text(t)
          PY

      - name: Install dependencies
        run: npm install
      - name: Rebuild portable single-file application
        run: node tools/build-single-file.mjs && cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate release
        run: npm test
      - name: Validate V6.8.1 module syntax
        run: node --check src/scripts/028-grouped-seating-visuals-v681.js
      - name: Remove temporary workflow and commit generated release integration
        shell: bash
        run: |
          rm .github/workflows/v681-grouped-seating-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json service-worker.js tools/validate-release.mjs tests/browser/smoke.spec.mjs CHANGELOG.md README.md index.html
          git add -u .github/workflows/v681-grouped-seating-build.yml
          git commit -m "Integrate V6.8.1 grouped seating visuals [generated v681]"
          git push origin HEAD:feat/v6.8.1-grouped-seating-visuals
