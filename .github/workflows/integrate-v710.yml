name: Integrate V7.1.0 Planner Assistant

on:
  push:
    branches: [feat/v7.1.0-planner-assistant]
    paths:
      - 'src/scripts/036-planner-assistant-v710.js'
      - 'tests/browser/planner-assistant-v710.spec.mjs'
      - 'schemas/planner-command-v1.schema.json'
      - '.integration/integrate-v710.mjs'
      - '.github/workflows/integrate-v710.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7.1.0-planner-assistant
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Planner Assistant source, regression test, and schema
        run: |
          node --check src/scripts/036-planner-assistant-v710.js
          node --check tests/browser/planner-assistant-v710.spec.mjs
          node -e "JSON.parse(require('fs').readFileSync('schemas/planner-command-v1.schema.json','utf8')); console.log('Planner command schema parses cleanly.')"
      - name: Integrate V7.1.0 release metadata
        run: node .integration/integrate-v710.mjs
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build portable single-file product
        run: |
          npm run build
          cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate release and service worker
        run: |
          npm test
          node --check service-worker.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npm run test:browser
      - name: Commit integrated V7.1.0 product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/scripts/036-planner-assistant-v710.js tests/browser/planner-assistant-v710.spec.mjs schemas/planner-command-v1.schema.json src/scripts/000-core.js src/scripts/025-classroom-feature-pack-v66.js src/manifest.json src/index.template.html package.json service-worker.js README.md CHANGELOG.md DATA-HANDLING.md tools/validate-release.mjs tests/browser index.html
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
          else
            git commit -m 'V7.1.0 Planner Assistant'
            git push origin HEAD:feat/v7.1.0-planner-assistant
          fi
