name: Rebuild V6.8 single-file artifact

on:
  push:
    branches: [feat/v6.8-classroom-intelligence]

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[generated index]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply V6.8 integration patch
        run: |
          base64 -d tools/apply-v68-integration.py.b64 > /tmp/apply-v68-integration.py
          python3 /tmp/apply-v68-integration.py
      - name: Rebuild deployable HTML
        run: |
          node tools/build-single-file.mjs
          cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate source and generated artifact
        run: npm test
      - name: Remove temporary integration helpers
        run: |
          rm -f .github/workflows/rebuild-v68.yml tools/apply-v68-integration.py.b64
      - name: Commit V6.8 integration and generated artifact
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate V6.8 Classroom Intelligence [generated index]"
          git push
