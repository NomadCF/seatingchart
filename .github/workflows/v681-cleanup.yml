name: V681 Cleanup Generated Dependencies

on:
  push:
    branches:
      - feat/v6.8.1-grouped-seating-visuals
    paths:
      - .github/workflows/v681-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v6.8.1-grouped-seating-visuals
          fetch-depth: 0
      - name: Remove generated dependency files
        run: |
          git rm -r --ignore-unmatch node_modules package-lock.json
          rm .github/workflows/v681-cleanup.yml
          git add -A
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove generated test dependencies from V6.8.1"
          git push origin HEAD:feat/v6.8.1-grouped-seating-visuals
