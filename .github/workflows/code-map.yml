name: Generate code map

on:
  push:
    branches: [feat/v6.7-production-hardening]
    paths:
      - index.html
      - tools/generate-code-map.mjs
      - .github/workflows/code-map.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/generate-code-map.mjs
      - name: Commit generated code map
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/generated-code-map.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate V6.7 code map"
          git push
