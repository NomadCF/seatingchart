name: Integrate V7.0.0 Digital Twin
on:
  push:
    branches: [feat/v7.0.0-digital-twin-foundation]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7.0.0-digital-twin-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Integrate V7 source changes
        run: node tools/integrate-v700.mjs
      - name: Apply browser regression fixes
        run: node tools/fix-v700-browser-regressions.mjs
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build single-file application
        run: npm run build
      - name: Refresh deployed single-file application
        run: cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate deterministic release
        run: npm test
      - name: Validate JSON schemas
        run: node -e "for (const f of ['schemas/planner-v13.schema.json','schemas/envelope-v3.schema.json','schemas/roster-import-v1.schema.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('Schemas parse cleanly.')"
      - name: Check service worker syntax
        run: node --check service-worker.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npm run test:browser
      - name: Commit integrated V7.0.0 source and build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scripts/000-core.js src/scripts/032-digital-twin-v700.js src/manifest.json src/index.template.html package.json service-worker.js README.md CHANGELOG.md tests/browser/interoperability-v69.spec.mjs tests/browser/digital-twin-v700.spec.mjs index.html
          git commit -m "Integrate V7.0.0 Classroom Digital Twin foundation" || exit 0
          git push origin HEAD:feat/v7.0.0-digital-twin-foundation
