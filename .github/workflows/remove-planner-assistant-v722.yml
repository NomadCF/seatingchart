name: V7.2.2 Planner Assistant removal

on:
  push:
    branches: [fix/remove-planner-assistant-v722]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-planner-assistant-v722
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Planner Assistant removal
        run: node tools/remove-planner-assistant-v722.mjs
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Rebuild portable application
        run: npm run build
      - name: Synchronize hosted entry point
        run: cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate release
        run: npm test
      - name: Check service worker syntax
        run: node --check service-worker.js
      - name: Check whitespace
        run: git diff --check
      - name: Commit synchronized V7.2.2 application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/remove-planner-assistant-v722.yml tools/remove-planner-assistant-v722.mjs || true
          if git diff --cached --quiet; then
            echo "No application changes to commit."
          else
            git commit -m "Remove Planner Assistant from V7.2.2"
            git push origin HEAD:fix/remove-planner-assistant-v722
          fi
