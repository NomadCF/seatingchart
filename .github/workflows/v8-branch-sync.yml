name: Temporary V8 branch sync

on:
  push:
    branches: [feat/v8-ui-overhaul]
    paths:
      - '.github/workflows/v8-branch-sync.yml'

permissions:
  contents: write

jobs:
  build-test-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build portable single-file app
        run: npm run build
      - name: Validate deterministic release
        run: |
          cp dist/Classroom-Seating-Planner.html index.html
          npm test
      - name: Check V8 module syntax
        run: node --check src/scripts/042-interface-v800.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run V8 desktop regression
        run: npx playwright test tests/browser/ui-v800.spec.mjs --project=desktop-chromium
      - name: Run V8 mobile regression
        run: npx playwright test tests/browser/ui-v800.spec.mjs --project=mobile-chromium
      - name: Commit synchronized portable build
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'build: synchronize V8 portable single-file app [skip ci]'
          git push
