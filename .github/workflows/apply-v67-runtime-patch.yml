name: Apply V6.7 runtime patch

on:
  pull_request:
    branches: [main]
    paths:
      - tools/apply-v67-runtime-patch.mjs

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/v6.7-production-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded runtime patch
        run: node tools/apply-v67-runtime-patch.mjs index.html
      - name: Verify JavaScript syntax and intended version
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)].filter(m => !/\bsrc\s*=/.test(m[1])).map(m => m[2]);
          fs.writeFileSync('/tmp/seating-inline.js', scripts.join('\n'));
          if (!/name="app-version" content="6\.7\.0"/.test(html)) throw new Error('Version bump missing');
          NODE
          node --check /tmp/seating-inline.js
      - name: Commit patched runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Apply V6.7 runtime collaboration hardening"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
