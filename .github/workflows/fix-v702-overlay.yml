name: Fix V7.0.2 station overlays
on:
  push:
    branches: [feat/v7.0.2-station-rotations]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7.0.2-station-rotations
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply overlay hardening
        run: node tools/fix-v702-overlay.mjs
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Rebuild single-file application
        run: npm run build
      - name: Refresh deployed single-file application
        run: cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate deterministic release
        run: npm test
      - name: Commit overlay hardening and build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scripts/034-station-rotations-v702.js tests/browser/station-rotations-v702.spec.mjs index.html
          git commit -m "Harden V7.0.2 station overlays" || exit 0
          git push origin HEAD:feat/v7.0.2-station-rotations
