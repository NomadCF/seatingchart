name: V7.2.1 UI fix integration

on:
  push:
    branches: [audit/full-code-cleanup-v720]
    paths:
      - '.integration/fix-assistant-ui-v721.mjs'
      - '.github/workflows/v721-ui-fix.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-code-cleanup-v720
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Planner Assistant and UI fixes
        run: node .integration/fix-assistant-ui-v721.mjs
      - name: Rebuild portable single-file product
        run: |
          npm install --no-package-lock
          npm run build
          cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate release
        run: |
          npm test
          node --check service-worker.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full desktop/mobile regression suite
        run: npm run test:browser
      - name: Commit verified UI fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src index.html tests/browser
          git commit -m 'Fix Planner Assistant usability and duplicate guided help'
          git push origin HEAD:audit/full-code-cleanup-v720
