name: Integrate V7.2.0 Planner Packs

on:
  push:
    branches: [feat/v7.2.0-planner-packs]
    paths:
      - '.integration/v720-module.part00'
      - '.integration/v720-module.part01'
      - '.integration/v720-module.part02'
      - '.integration/v720-module.part03'
      - '.integration/v720-test.b64'
      - '.integration/v720-schema.b64'
      - '.integration/v720-integrate.b64'
      - '.github/workflows/integrate-v720.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7.2.0-planner-packs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize V7.2 source, tests, schema, and integration script
        run: |
          cat .integration/v720-module.part00 .integration/v720-module.part01 .integration/v720-module.part02 .integration/v720-module.part03 | base64 -d | gzip -d > src/scripts/037-planner-packs-v720.js
          base64 -d .integration/v720-test.b64 | gzip -d > tests/browser/planner-packs-v720.spec.mjs
          base64 -d .integration/v720-schema.b64 | gzip -d > schemas/planner-pack-v1.schema.json
          base64 -d .integration/v720-integrate.b64 | gzip -d > .integration/integrate-v720.mjs
          node --check src/scripts/037-planner-packs-v720.js
          node --check tests/browser/planner-packs-v720.spec.mjs
          node --check .integration/integrate-v720.mjs
          node -e "JSON.parse(require('fs').readFileSync('schemas/planner-pack-v1.schema.json','utf8')); console.log('Planner Pack schema parses cleanly.')"
      - name: Integrate V7.2.0 release metadata
        run: node .integration/integrate-v720.mjs
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build portable single-file product
        run: |
          npm run build
          cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate release and service worker
        run: |
          npm test
          node --check service-worker.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Diagnose V7.2 Planner Pack browser tests
        run: npx playwright test tests/browser/planner-packs-v720.spec.mjs --project=desktop-chromium --reporter=line
      - name: Run full desktop and mobile browser tests
        run: npm run test:browser
      - name: Commit integrated V7.2.0 product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/scripts/037-planner-packs-v720.js tests/browser/planner-packs-v720.spec.mjs schemas/planner-pack-v1.schema.json src/scripts/000-core.js src/scripts/025-classroom-feature-pack-v66.js src/manifest.json src/index.template.html package.json service-worker.js README.md CHANGELOG.md DATA-HANDLING.md tools/validate-release.mjs tests/browser index.html
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
          else
            git commit -m 'V7.2.0 Planner Packs'
            git push origin HEAD:feat/v7.2.0-planner-packs
          fi
