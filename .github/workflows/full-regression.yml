name: Full browser regression

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-check:
    name: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Validate deterministic release
        run: npm test

  browser-regression:
    name: ${{ matrix.project }} full regression
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full browser regression
        run: npx playwright test --project=${{ matrix.project }} --retries=0
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-full-regression-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
