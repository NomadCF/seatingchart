name: Rebuild V6.8 planning menu fix

on:
  push:
    branches: [feat/v6.8-classroom-intelligence]

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[generated menu fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply V6.8 planning menu and browser-path fixes
        run: |
          base64 -d tools/fix-v68-menu.py.b64 > /tmp/fix-v68-menu.py
          python3 /tmp/fix-v68-menu.py
      - name: Rebuild deployable HTML
        run: |
          node tools/build-single-file.mjs
          cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate source and generated artifact
        run: npm test
      - name: Remove temporary helpers
        run: |
          rm -f .github/workflows/rebuild-v68-menu-fix.yml tools/fix-v68-menu.py.b64
      - name: Commit menu UX fix and generated artifact
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix V6.8 Advanced planning menu access [generated menu fix]"
          git push
