name: Build and critical smoke checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check:
    name: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Verify modular source has no trailing whitespace
        run: |
          if git grep -nI -E '[[:blank:]]+$' -- src; then
            echo 'Trailing whitespace found in modular source.'
            exit 1
          fi
      - name: Build portable single-file app
        run: npm run build
      - name: Verify committed generated files match modular source
        run: |
          if ! cmp --silent dist/Classroom-Seating-Planner.html index.html; then
            echo "index.html is stale. Run npm run build and copy dist/Classroom-Seating-Planner.html to index.html before merging."
            exit 1
          fi
          if ! git diff --quiet -- dist/Classroom-Seating-Planner.html; then
            echo "dist/Classroom-Seating-Planner.html is stale. Commit the freshly built portable file before merging."
            git --no-pager diff --stat -- dist/Classroom-Seating-Planner.html
            exit 1
          fi
      - name: Validate deterministic release
        run: npm test
      - name: Validate JSON schemas
        run: |
          node -e "for (const f of ['schemas/planner-v13.schema.json','schemas/envelope-v3.schema.json','schemas/roster-import-v1.schema.json','schemas/planner-command-v1.schema.json','schemas/planner-pack-v1.schema.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('Schemas parse cleanly.')"
      - name: Check service worker syntax
        run: node --check service-worker.js
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: classroom-seating-planner-portable
          path: dist/Classroom-Seating-Planner.html
          if-no-files-found: error
          retention-days: 7

  critical-smoke:
    name: critical-smoke
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile critical smoke tests
        run: npm run test:smoke
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-smoke-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
