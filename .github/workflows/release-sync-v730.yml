name: One-time V7.3.0 release synchronization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-sync-v730.yml'

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Synchronize V7.3.0 release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          version = '7.3.0'
          date = '2026-09-05'
          date_display = 'September 5, 2026'

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['version'] = version
          scripts = package.setdefault('scripts', {})
          scripts.setdefault('test:assistant', 'playwright test tests/browser/planner-assistant-v710.spec.mjs tests/browser/planner-assistant-v730.spec.mjs tests/browser/ui-audit-v721.spec.mjs tests/browser/ui-audit-v721-hotfix.spec.mjs')
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          core_path = Path('src/scripts/000-core.js')
          core = core_path.read_text()
          core = core.replace("version: '7.2.1'", "version: '7.3.0'", 1)
          core = core.replace("releaseDate: '2026-09-05'", "releaseDate: '2026-09-05'", 1)
          core = core.replace("releaseDateDisplay: 'September 5, 2026'", "releaseDateDisplay: 'September 5, 2026'", 1)
          old_feature = "{ title: 'Planner Assistant', text: 'Translate teacher requests into explicit existing planner actions with a local deterministic interpreter, show student-name ambiguity instead of guessing, preview rule and seating impact before applying, explain current placements and conflicts from real planner findings, and keep a small browser-local command history.' }"
          new_feature = "{ title: 'Planner Assistant', text: 'Use a first-class local planning workspace with broader classroom language, class-scoped conversational context, working plans, candidate-seat ranking and comparison, explicit apply and undo, chart-health and fairness analysis, testing orchestration, named-plan comparison, and direct launchers into Today Mode, Activity Layouts, Station Rotations, Planner Packs, snapshots, printing, and related planner workflows.' }"
          core = core.replace(old_feature, new_feature)
          if "version: '7.3.0'," not in core.split('const RELEASE_HISTORY = [', 1)[1][:1200]:
              marker = 'const RELEASE_HISTORY = [\n'
              entry = """  {\n    version: '7.3.0',\n    date: 'September 5, 2026',\n    title: 'Planner Assistant workspace and conversational planning',\n    current: true,\n    changes: [\n      'Expanded Planner Assistant into a first-class planning workspace with a persistent class-scoped working plan and short multi-turn conversational context.',\n      'Added candidate-seat workflows, current-versus-proposed seat comparison, explicit candidate application, and follow-ups such as show options then use the second one.',\n      'Added chart-health, hardest-to-seat, unseated-student, rule-pressure, repair-priority, and fairness comparison analysis driven by existing planner engines.',\n      'Added compound Testing Mode orchestration that can preserve locked seats and accessibility placements while reporting practical fit constraints before applying changes.',\n      'Added direct Assistant launchers into named plans, Today Mode, Activity Layouts, Station Rotations, Planner Packs, snapshots, printing, undo, and redo.',\n      'Centralized Assistant help and visibility controls, removed repeated Guide me buttons, improved natural-language normalization, and changed unrecognized requests into clarifications or useful suggestions instead of parser dead ends.',\n      'Kept the Assistant browser-local and deterministic. It does not send classroom data to an external AI service and does not silently invent student behavior labels or mutate the classroom without explicit application.'\n    ]\n  },\n"""
              core = core.replace(marker, marker + entry, 1)
          core_path.write_text(core)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          if not changelog.lstrip().startswith('## 7.3.0'):
              section = """## 7.3.0 - 2026-09-05\n\n### Planner Assistant workspace\n- Expanded Planner Assistant from a command bar into a first-class planning workspace with a persistent class-scoped working plan and short conversational context.\n- Added broader natural-language handling and follow-up requests such as “Keep Maya near the front” followed by “But not next to Noah.”\n- Added candidate-seat discovery, ranked options, current-versus-proposed seat comparison, explicit candidate application, and follow-ups such as “Use the second one.”\n- Added chart-health, hardest-to-seat, unseated-student, rule-pressure, repair-priority, and fairness analysis using the planner’s existing seating and rule engines.\n- Added compound Testing Mode planning that can preserve locked seats and accessibility placements, maximize practical spacing, and report what cannot fit before applying changes.\n- Added direct Assistant access to named seating plans, Today Mode, Activity Layouts, Station Rotations, Planner Packs, snapshots, printing, undo, and redo.\n- Added a dedicated responsive Assistant workspace for desktop and mobile with conversation history, working-plan context, candidate results, proposed actions, and contextual suggestions.\n- Centralized Assistant help and visibility controls with Command bar, Compact, and Hidden states; removed repeated contextual “Guide me” buttons from menus and surfaces.\n- Replaced generic parser dead ends with clarification prompts, suggested classroom requests, ambiguity handling, and protection against student-name/keyword collisions such as a student named Ada.\n- Added safeguards so behavior labels are never inferred for students unless they come from an explicit teacher-defined group or rule.\n- Added dedicated Planner Assistant browser regression coverage for multi-turn context, candidate-seat workflows, compound testing requests, chart analysis, responsive layout, and planner integration launchers.\n- Kept the Assistant local and deterministic: classroom data is not sent to an external AI service, planner mutations remain preview/apply operations, and undo remains available.\n- Planner data schema remains 13 and encryption envelope remains 3.\n\n"""
              changelog_path.write_text(section + changelog)

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text()
          import re
          sw = re.sub(r"const CACHE_VERSION = 'classroom-seating-planner-v[^']+';", "const CACHE_VERSION = 'classroom-seating-planner-v7.3.0-pwa1';", sw, count=1)
          sw_path.write_text(sw)
          PY

      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build synchronized single-file release
        run: |
          npm run build
          cp dist/Classroom-Seating-Planner.html index.html
      - name: Validate synchronized release
        run: |
          npm test
          node --check service-worker.js
          cmp --silent dist/Classroom-Seating-Planner.html index.html
      - name: Commit synchronized V7.3.0 release
        run: |
          if git diff --quiet; then
            echo 'V7.3.0 release files are already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/scripts/000-core.js CHANGELOG.md service-worker.js index.html
          git commit -m 'release: synchronize V7.3.0 metadata and single-file build'
          git push
