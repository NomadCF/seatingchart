  <text x="70" y="108" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">From roster to a workable seating plan</text>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="18" fill="#475569">Design the room, add real student needs, generate a plan, review conflicts, then share only what is appropriate.</text>
